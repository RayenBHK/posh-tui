name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: posh-tui-x86_64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: posh-tui-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: posh-tui-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: posh-tui-x86_64-windows.exe
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: posh-tui-aarch64-linux
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/posh-tui ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/posh-tui.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: sha256sum posh-tui-* > checksums.txt

      - name: Extract release notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' > RELEASE_NOTES.txt

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.txt
          files: |
            posh-tui-x86_64-linux
            posh-tui-x86_64-macos
            posh-tui-aarch64-macos
            posh-tui-x86_64-windows.exe
            posh-tui-aarch64-linux
            checksums.txt
