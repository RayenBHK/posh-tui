[package]
name = "posh-tui"
version = "0.4.1"
description = "A terminal UI for browsing, previewing, and applying Oh My Posh themes"
license = "MIT"
repository = "https://github.com/RayenBHK/posh-tui"
keywords = ["tui", "oh-my-posh", "terminal", "theme", "ratatui"]
categories = ["command-line-utilities"]
edition = "2021"

[[bin]]
name = "posh-tui"
path = "src/main.rs"

[dependencies]
clap       = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ratatui    = "0.29"
crossterm  = "0.28"
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
dirs-next  = "2"
nucleo     = "0.5"
ansi-to-tui = "7"
rand       = "0.9"

[dev-dependencies]
tempfile   = "3.10"
wiremock = "0.6.5"
insta = "1.39"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1
