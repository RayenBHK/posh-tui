[package]
name = "posh-tui"
version = "0.2.0"
description = "A terminal UI for browsing, previewing, and applying Oh My Posh themes"
license = "MIT"
repository = "https://github.com/RayenBHK/posh-tui"
keywords = ["tui", "oh-my-posh", "terminal", "theme", "ratatui"]
categories = ["command-line-utilities"]
edition = "2021"

[[bin]]
name = "posh-tui"
path = "src/main.rs"

[dependencies]
ratatui    = "0.29"
crossterm  = "0.28"
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", features = ["json"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
dirs-next  = "2"
nucleo     = "0.5"
ansi-to-tui = "7"
rand       = "0.9"

[profile.release]
opt-level = 3
strip = true
